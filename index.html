<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectrum Pure SEO Agency & Client Portal - Production Console</title>
  
  <!-- Base Theme Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Fira Code & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- GSAP & ScrollTrigger Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- JavaScript Modular Architecture -->
  <script src="js/security.js"></script>
  <script src="js/generalSettings.js"></script>
  <script src="js/emailEngine.js"></script>
  <script src="js/menuEngine.js"></script>
  <script src="js/pageTemplateEngine.js"></script>
  <script src="js/userAuth.js"></script>
  <script src="js/userAdmin.js"></script>
  <script src="js/userDashboard.js"></script>

</html>
